<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GIGZA - Offline</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #ffffff 0%, #faf9ff 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    
    .offline-container {
      text-align: center;
      max-width: 450px;
      background: white;
      padding: 3rem;
      border-radius: 32px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.05);
      border: 1px solid rgba(255, 0, 255, 0.2);
    }
    
    .offline-icon {
      font-size: 5rem;
      margin-bottom: 1.5rem;
      background: linear-gradient(135deg, #FF00FF, #00D4FF);
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
    }
    
    h1 {
      color: #FF00FF;
      margin-bottom: 1rem;
      font-size: 2rem;
    }
    
    p {
      color: #5a5a7a;
      margin-bottom: 2rem;
      line-height: 1.6;
    }
    
    .retry-btn {
      background: linear-gradient(135deg, #FF00FF, #601A8E);
      color: white;
      border: none;
      padding: 1rem 2rem;
      border-radius: 40px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s;
    }
    
    .retry-btn:hover {
      transform: translateY(-2px);
    }
    
    .features-list {
      margin-top: 2rem;
      text-align: left;
      border-top: 1px solid rgba(255, 0, 255, 0.2);
      padding-top: 2rem;
    }
    
    .features-list h3 {
      color: #1a1a2e;
      margin-bottom: 1rem;
      font-size: 1rem;
    }
    
    .features-list ul {
      list-style: none;
      padding-left: 0;
    }
    
    .features-list li {
      margin: 0.8rem 0;
      color: #5a5a7a;
      display: flex;
      align-items: center;
      gap: 0.8rem;
    }
    
    .features-list li i {
      color: #FF00FF;
      width: 20px;
    }
  </style>
</head>
<body>
  <div class="offline-container">
    <div class="offline-icon">
      <i class="fas fa-wifi"></i>
    </div>
    <h1>You're Offline</h1>
    <p>Don't worry! GIGZA works offline too. Connect to Wi-Fi to discover new creatives and book gigs.</p>
    <button class="retry-btn" onclick="location.reload()">
      <i class="fas fa-sync-alt"></i> Try Again
    </button>
    
    <div class="features-list">
      <h3><i class="fas fa-check-circle"></i> Available Offline:</h3>
      <ul>
        <li><i class="fas fa-calendar"></i> View your bookings</li>
        <li><i class="fas fa-star"></i> Check saved DJs</li>
        <li><i class="fas fa-chart-line"></i> View earnings</li>
        <li><i class="fas fa-envelope"></i> Read messages</li>
      </ul>
    </div>
  </div>
</body>
</html>
